<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站长小站 · 部署测试</title>
    <!-- 优雅字体与图标库 (仅用于美观，完全静态) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b0d15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态背景光晕 —— 纯静态但视觉丰富 */
        .glow {
            position: fixed;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 110, 255, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            top: -20vmax;
            left: -20vmax;
            z-index: -1;
            filter: blur(40px);
            animation: floatGlow 18s ease-in-out infinite alternate;
        }

        .glow-2 {
            position: fixed;
            width: 70vmax;
            height: 70vmax;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 100, 200, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -30vmax;
            right: -20vmax;
            z-index: -1;
            filter: blur(50px);
            animation: floatGlow2 22s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 8%) scale(1.15); }
        }

        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-8%, -5%) scale(1.2); }
        }

        /* 主卡片 — 毛玻璃质感 */
        .card {
            width: 100%;
            max-width: 760px;
            background: rgba(18, 22, 33, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            padding: 3rem 2.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 40px 70px -18px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        }

        /* 徽章 / 小提示 */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            padding: 0.35rem 1rem 0.35rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #aab4d4;
            margin-bottom: 2rem;
            backdrop-filter: blur(4px);
            width: fit-content;
        }

        .badge i {
            font-size: 0.7rem;
            color: #6d8cff;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -1.5px;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        h1 span {
            background: linear-gradient(135deg, #a5b4ff, #d9a7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subhead {
            font-size: 1.1rem;
            color: #8f9bb5;
            margin-bottom: 2.5rem;
            font-weight: 400;
            line-height: 1.6;
            max-width: 90%;
            border-left: 3px solid rgba(130, 150, 255, 0.5);
            padding-left: 1.2rem;
        }

        /* 链接卡片网格 */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
            margin: 2.8rem 0 2rem;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
            padding: 1.25rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: all 0.25s ease;
            text-decoration: none;
            color: inherit;
            backdrop-filter: blur(4px);
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(130, 150, 255, 0.4);
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 12px 25px -10px rgba(0, 20, 80, 0.6);
        }

        .link-item i {
            font-size: 1.6rem;
            color: #98abff;
            margin-bottom: 0.3rem;
            transition: color 0.2s;
        }

        .link-item:hover i {
            color: #c1cdff;
        }

        .link-item .label {
            font-weight: 600;
            font-size: 1rem;
            color: #eef2ff;
            letter-spacing: -0.2px;
        }

        .link-item .desc {
            font-size: 0.75rem;
            color: #7f8aa8;
            font-weight: 400;
        }

        /* 部署状态 / 测试信息 */
        .status-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 100px;
            padding: 0.75rem 1.5rem;
            margin-top: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3ad67a;
            box-shadow: 0 0 12px #3ad67a;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        .status-text {
            font-size: 0.85rem;
            font-weight: 500;
            color: #b7c0d8;
        }

        .status-text strong {
            color: #ffffff;
            font-weight: 600;
        }

        .version-tag {
            font-size: 0.75rem;
            color: #677394;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.25rem 0.8rem;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'Inter', monospace;
            letter-spacing: 0.3px;
        }

        /* 页脚小字 */
        .footnote {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.75rem;
            color: #3e4862;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .footnote i {
            font-size: 0.7rem;
            color: #4f5c7a;
            margin-right: 0.2rem;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subhead {
                font-size: 1rem;
                max-width: 100%;
            }

            .link-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }

            .link-item {
                padding: 1rem;
            }

            .status-panel {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
                border-radius: 1.5rem;
            }

            .badge {
                margin-bottom: 1.5rem;
            }
        }

        @media (max-width: 400px) {
            .link-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 背景光晕装饰 (纯静态，但看起来生动) -->
    <div class="glow"></div>
    <div class="glow-2"></div>

    <!-- 主卡片 -->
    <div class="card">
        <!-- 部署测试徽章 -->
        <div class="badge">
            <i class="fas fa-flask"></i>
            <span>部署测试 · 静态预览</span>
        </div>

        <h1>
            <span>站长</span> · 小站
        </h1>
        <div class="subhead">
            一个简洁、好看的静态导航页。所有资源均为纯静态，用于快速验证部署环境。
        </div>

        <!-- 快捷链接区块 — 模拟几个常用入口，没有真实后端，链接可自行修改 -->
        <div class="link-grid">
            <a href="#" class="link-item" onclick="return false;">
                <i class="fas fa-chart-line"></i>
                <span class="label">数据概览</span>
                <span class="desc">Dashboard</span>
            </a>
            <a href="#" class="link-item" onclick="return false;">
                <i class="fas fa-file-alt"></i>
                <span class="label">内容管理</span>
                <span class="desc">Articles</span>
            </a>
            <a href="#" class="link-item" onclick="return false;">
                <i class="fas fa-comments"></i>
                <span class="label">评论审核</span>
                <span class="desc">Comments</span>
            </a>
            <a href="#" class="link-item" onclick="return false;">
                <i class="fas fa-image"></i>
                <span class="label">媒体库</span>
                <span class="desc">Media</span>
            </a>
            <a href="#" class="link-item" onclick="return false;">
                <i class="fas fa-cog"></i>
                <span class="label">站点设置</span>
                <span class="desc">Settings</span>
            </a>
            <a href="#" class="link-item" onclick="return false;">
                <i class="fas fa-shield-alt"></i>
                <span class="label">安全中心</span>
                <span class="desc">Security</span>
            </a>
        </div>

        <!-- 实时状态面板 — 静态文字但传达部署测试信息 -->
        <div class="status-panel">
            <div class="status-indicator">
                <span class="dot"></span>
                <span class="status-text">
                    <strong>部署成功</strong> · 页面已就绪
                </span>
            </div>
            <span class="version-tag">
                <i class="fas fa-code-branch" style="margin-right: 6px;"></i>v1.0.0 / static
            </span>
        </div>

        <!-- 底部微小信息 -->
        <div class="footnote">
            <span><i class="fas fa-check-circle"></i> 纯静态 · 无依赖</span>
            <span><i class="fas fa-bolt"></i> 快速加载</span>
            <span><i class="fas fa-mobile-alt"></i> 响应式</span>
        </div>
    </div>

    <!-- 微小的交互反馈：链接被点击时（虽然不跳转，但视觉上表示测试）  -->
    <script>
        // 阻止所有占位链接跳转 (仅用于演示，不包含任何外部依赖)
        document.querySelectorAll('.link-item').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                // 加一点点击涟漪效果 (纯视觉)
                link.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    link.style.transform = '';
                }, 120);
            });
        });
    </script>
</body>
</html>
